
services:
  mysql:
    image: mysql:8.4.9
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: callp_local_db
      MYSQL_USER: callp_dev
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}

    ports:
      - "127.0.0.1:3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d/sql:ro
      - ./docker/mysql/00_initialize.sh:/docker-entrypoint-initdb.d/00_initialize.sh:ro

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:
