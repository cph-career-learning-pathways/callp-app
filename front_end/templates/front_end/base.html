{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Django AWS Demo{% endblock %}</title>
  <link rel="stylesheet"
        href="{% static 'css/global.css' %}" >
</head>

<body>

  {% include "front_end/partials/topbar.html" %}
  {% include "front_end/partials/leftbar.html" %}
  
  <div class="page-layout">
  
    <main class="main-content">
      {% block content %}
      {% endblock %}
    </main>
  
  </div>

  <footer class="footer">Powered by Django on AWS</footer>

  <script src="{% static 'javascript/main.js' %}" defer></script>
</body>
</html>
