{% extends "front_end/base.html" %}
{% load static %}

{% block title %}Password updated | CaLLP{% endblock %}

{% block content %}
<link rel="stylesheet" href="{% static 'accounts/password_reset.css' %}">
<section class="account-panel" aria-labelledby="account-title">
  <p class="account-eyebrow">CaLLP account recovery</p>
  <h1 id="account-title">Password updated</h1>
  <p class="account-lede">Your password has been changed successfully. You can now sign in with your new password.</p>
  <p class="account-footer"><a class="account-button account-button-link" href="{% url 'login' %}">Log in</a></p>
</section>
{% endblock %}
